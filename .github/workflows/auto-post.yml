name: Auto Post Reel

# One-call publisher: builds a reel from the top eligible job and posts it.
# The backend enforces the 15-min cadence gate, so frequent calls are safe.
on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes (UTC); backend gate is authoritative
  workflow_dispatch:          # manual "Run workflow" button

concurrency:
  group: auto-post
  cancel-in-progress: false

jobs:
  auto-post:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/auto-post
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BACKEND_URL:-}" ]; then
            echo "BACKEND_URL secret is not set."
            exit 1
          fi
          echo "Calling ${BACKEND_URL%/}/api/cron/auto-post"
          code=$(curl -sS -o resp.json -w "%{http_code}" \
            -X POST "${BACKEND_URL%/}/api/cron/auto-post" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 300)
          echo "HTTP ${code}"
          cat resp.json || true
          echo
          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "auto-post failed (HTTP ${code})"
            exit 1
          fi
