name: Process and Publish Bundle Reel
on:
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Bypass backend cadence gate for manual testing"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
  id-token: write
concurrency:
  group: publish-reel
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: '--no-deprecation'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install video and OCR tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr fonts-dejavu-core
      - name: Install processing dependencies
        run: pip install Pillow 'opencv-python-headless>=4.10,<5'
      - name: Select, process and publish one eligible reel
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
          OMP_THREAD_LIMIT: '1'
          REEL_FFMPEG_THREADS: '2'
          REEL_RENDER_PRESET: veryfast
          FORCE_PUBLISH: ${{ inputs.force_publish || 'false' }}
        run: python scripts/run_bundle.py
      - name: Check for processing reports
        if: always()
        id: check-reports
        run: |
          if [ -d bundle-output ] && ls bundle-output/*-report.json bundle-output/selection.json >/dev/null 2>&1; then
            echo "has_reports=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_reports=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Save processing reports
        if: always() && steps.check-reports.outputs.has_reports == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bundle-processing-reports
          path: |
            bundle-output/*-report.json
            bundle-output/selection.json
          if-no-files-found: ignore
          retention-days: 14
