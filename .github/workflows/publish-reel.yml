name: Publish Reel

on:
  schedule:
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [publish-reel]     # fired by the backend after Cloudflare cron calls it
  workflow_dispatch:          # manual "Run workflow" button
    inputs:
      force_publish:
        description: "Bypass backend cadence gate for manual testing"
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-reel
  cancel-in-progress: false

permissions:
  contents: write            # needed to create/upload/prune Release assets

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout worker
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # Cache a single static ffmpeg binary instead of apt-installing ~99
      # packages every run (that was ~1m40s). First run downloads ~30MB once;
      # every run after restores from cache in a couple of seconds.
      - name: Cache ffmpeg static binary
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-amd64-v1

      - name: Download ffmpeg static binary (cache miss only)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/ffmpeg-static
          curl -fsSL -o /tmp/ffmpeg.tar.xz \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xJf /tmp/ffmpeg.tar.xz --strip-components=1 -C ~/ffmpeg-static
          ~/ffmpeg-static/ffmpeg -version | head -1

      - name: Put ffmpeg on PATH
        run: echo "$HOME/ffmpeg-static" >> "$GITHUB_PATH"

      # Single loop: the script builds the next reel (cadence-gated), renders
      # the MP4, publishes via the thin backend endpoints, and reports outcome.
      - name: Build + render + publish
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: reel-media
          KEEP_ASSETS: '5'
          REEL_SECONDS: '12'
          FORCE_PUBLISH: ${{ inputs.force_publish || 'false' }}
        run: python scripts/publish_reel.py
