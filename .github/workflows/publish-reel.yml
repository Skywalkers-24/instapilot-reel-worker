name: Process and Publish Bundle Reel
on:
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Bypass backend cadence gate for manual testing"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
  id-token: write
concurrency:
  group: publish-reel
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: '--no-deprecation'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Cache apt packages
        id: cache-apt
        uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: apt-ocr-${{ runner.os }}-ubuntu-24.04

      - name: Install video and OCR tools
        run: |
          mkdir -p ~/apt-cache
          if [ "${{ steps.cache-apt.outputs.cache-hit }}" = "true" ] && ls ~/apt-cache/*.deb >/dev/null 2>&1; then
            echo "Installing OCR packages from cache..."
            sudo dpkg -i -E ~/apt-cache/*.deb 2>/dev/null || (sudo apt-get update && sudo apt-get install -y tesseract-ocr fonts-dejavu-core)
          else
            echo "Downloading and installing OCR packages..."
            sudo apt-get update
            sudo apt-get install --download-only -y tesseract-ocr fonts-dejavu-core
            cp -n /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true
            sudo dpkg -i -E ~/apt-cache/*.deb 2>/dev/null || sudo apt-get install -y tesseract-ocr fonts-dejavu-core
          fi

      - name: Cache bundle source archives
        uses: actions/cache@v6
        with:
          path: bundles
          key: bundle-archives-${{ hashFiles('data/bundle_manifest.json') }}

      - name: Install processing dependencies
        run: pip install Pillow 'opencv-python-headless>=4.10,<5'
      - name: Select, process and publish one eligible reel
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
          OMP_THREAD_LIMIT: '1'
          REEL_FFMPEG_THREADS: '2'
          REEL_RENDER_PRESET: veryfast
          FORCE_PUBLISH: ${{ inputs.force_publish || 'false' }}
        run: python scripts/run_bundle.py
      - name: Check for processing reports
        if: always()
        id: check-reports
        run: |
          if [ -d bundle-output ] && ls bundle-output/*-report.json bundle-output/selection.json >/dev/null 2>&1; then
            echo "has_reports=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_reports=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Save processing reports
        if: always() && steps.check-reports.outputs.has_reports == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bundle-processing-reports
          path: |
            bundle-output/*-report.json
            bundle-output/selection.json
          if-no-files-found: ignore
          retention-days: 14
