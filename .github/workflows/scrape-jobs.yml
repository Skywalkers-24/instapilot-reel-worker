name: Scrape Jobs

on:
  repository_dispatch:
    types: [scrape-jobs]     # fired by Cloudflare cron via backend trigger
  workflow_dispatch:          # manual "Run workflow" button
  schedule:
    - cron: '0 */12 * * *'    # fallback schedule

concurrency:
  group: scrape-jobs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout worker
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Scrape top-200 companies on the runner (India freshers)
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TOP_N: '200'
          MAX_JOBS_PER_COMPANY: '3'
          INGEST_BATCH: '40'
        run: python scripts/scrape_jobs.py
