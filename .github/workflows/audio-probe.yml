name: Audio Probe (diagnostic)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/ig/audio-probe
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl -sS -X POST "${BACKEND_URL%/}/api/cron/ig/audio-probe" \
            -H "X-Cron-Secret: ${CRON_SECRET}" -H "Content-Type: application/json" \
            --max-time 60
          echo
