name = "instapilot-reel-publish-cron"
main = "src/index.js"
compatibility_date = "2026-08-28"

[triggers]
# Reel publish: 1:00 PM, 6:00 PM, 8:00 PM and 10:00 PM IST
# (07:30, 12:30, 14:30 and 16:30 UTC).
# Job scraping remains at 6:00 AM and 4:00 PM IST (00:30 and 10:30 UTC).
crons = [
  "30 7,12,14,16 * * *",
  "30 0,10 * * *"
]



