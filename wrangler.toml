name = "instapilot-reel-publish-cron"
main = "src/index.js"
compatibility_date = "2026-08-28"

[triggers]
# 1. Reel Publish: 1 Reel Every Hour (24 reels / day max)
#    - Fires at minute :00 of every hour
# 2. Job Scraping: 6:00 AM IST (00:30 UTC) & 4:00 PM IST (10:30 UTC)
crons = [
  "0 * * * *",
  "30 0,10 * * *"
]



